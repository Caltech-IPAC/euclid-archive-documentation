[tox]
envlist =
    buildhtml
requires =
    pip >= 19.3.1

[testenv]

description = Build site

passenv = BASE_URL, KM_SOURCE

deps =
    # We use these files to specify all the dependencies, and below we override
    # versions for specific testing schenarios
    -rsite_requirements.txt

allowlist_externals = bash, sed

commands =
    pip freeze

    # Build the MyST plugin bundle before building the site with jupyter-book
    buildhtml: bash -c "cd plugins && npm install && npm run build"

    buildhtml: bash -c "jupyter-book build --html --strict -d --check-links"

skip_install = true
