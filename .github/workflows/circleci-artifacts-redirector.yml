name: Run CircleCI artifacts redirector for rendered HTML

on: [status]
jobs:
  circleci_artifacts_redirector_job:
    runs-on: ubuntu-latest
    name: Run CircleCI artifacts redirector
    steps:
      - name: GitHub Action step
        uses: scientific-python/circleci-artifacts-redirector-action@d35a82a1e5de3864f4cf9649eb7cedcedcfe8e09  # v1.3.2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          api-token: ${{ secrets.EUCLID_DOCUMENTATION_CIRCLE_TOKEN }}
          artifact-path: 0/_build/html/index.html
          circleci-jobs: build-docs
          domain: circle.scientific-python.dev
          job-title: "--> Rendering Preview <--"
